services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      WEB_URL: ${WEB_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REALTIME_DATABASE_URL: ${REALTIME_DATABASE_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      PROJECT_JWT_SECRET: ${PROJECT_JWT_SECRET:?Set PROJECT_JWT_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      INVITE_SECRET: ${INVITE_SECRET:?Set INVITE_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000/api
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true

